{% extends "base.html" %}

{% block title %}
Add Server | InfraTrack
{% endblock %}

{% block content %}

<h1 class="page-title">Add Server</h1>

<p class="page-subtitle">
    Register a new infrastructure server.
</p>

<div class="card form-card">

<form action="{{ url_for('add_server') }}" method="POST">

    <div class="form-group">

        <label>Server Name</label>

        <input
            type="text"
            name="server_name"
            placeholder="e.g. WEB-01"
            required
        >

    </div>

    <div class="form-group">

        <label>Server Role</label>

        <select name="server_role" required>

            <option value="">Select Role</option>

            <option>Web Server</option>

            <option>Application Server</option>

            <option>Database Server</option>

            <option>Cache Server</option>

            <option>Load Balancer</option>

            <option>Monitoring Server</option>

            <option>Bastion Host</option>

        </select>

    </div>

    <div class="form-group">

        <label>Environment</label>

        <select name="environment" required>

            <option value="">Select Environment</option>

            <option>Development</option>

            <option>Testing</option>

            <option>Production</option>

        </select>

    </div>

    <div class="form-group">

        <label>Operating System</label>

        <input
            type="text"
            name="operating_system"
            placeholder="Ubuntu 24.04 / Amazon Linux / RHEL"
            required
        >

    </div>

    <div class="form-group">

        <label>IP Address</label>

        <input
            type="text"
            name="ip_address"
            placeholder="192.168.1.10"
            pattern="^(?:(?:25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})\.){3}(?:25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})$"
            title="Enter a valid IPv4 address"
            required
        >

    </div>

    <div class="form-group">

        <label>Owner</label>

        <input
            type="text"
            name="owner"
            placeholder="Infrastructure Team"
            required
        >

    </div>

    <div class="form-group">

        <label>Status</label>

        <select name="status">

            <option selected>Running</option>

            <option>Stopped</option>

        </select>

    </div>

    <button type="submit" class="btn-primary">

        Save Server

    </button>

</form>

</div>

{% endblock %}
