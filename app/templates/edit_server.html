{% extends "base.html" %}

{% block title %}
Edit Server | InfraTrack
{% endblock %}

{% block content %}

<h1 class="page-title">Edit Server</h1>

<p class="page-subtitle">
    Update server information.
</p>

<div class="card form-card">

<form method="POST">

    <div class="form-group">

        <label>Server Name</label>

        <input
            type="text"
            name="server_name"
            value="{{ server.server_name }}"
            required>

    </div>

    <div class="form-group">

        <label>Server Role</label>

        <select name="server_role" required>

            <option value="Web Server"
                {% if server.server_role == "Web Server" %}selected{% endif %}>
                Web Server
            </option>

            <option value="Application Server"
                {% if server.server_role == "Application Server" %}selected{% endif %}>
                Application Server
            </option>

            <option value="Database Server"
                {% if server.server_role == "Database Server" %}selected{% endif %}>
                Database Server
            </option>

            <option value="Cache Server"
                {% if server.server_role == "Cache Server" %}selected{% endif %}>
                Cache Server
            </option>

            <option value="Load Balancer"
                {% if server.server_role == "Load Balancer" %}selected{% endif %}>
                Load Balancer
            </option>

            <option value="Monitoring Server"
                {% if server.server_role == "Monitoring Server" %}selected{% endif %}>
                Monitoring Server
            </option>

            <option value="Bastion Host"
                {% if server.server_role == "Bastion Host" %}selected{% endif %}>
                Bastion Host
            </option>

        </select>

    </div>

    <div class="form-group">

        <label>Environment</label>

        <select name="environment" required>

            <option value="Development"
                {% if server.environment == "Development" %}selected{% endif %}>
                Development
            </option>

            <option value="Testing"
                {% if server.environment == "Testing" %}selected{% endif %}>
                Testing
            </option>

            <option value="Production"
                {% if server.environment == "Production" %}selected{% endif %}>
                Production
            </option>

        </select>

    </div>

    <div class="form-group">

        <label>Operating System</label>

        <input
            type="text"
            name="operating_system"
            value="{{ server.operating_system }}"
            required>

    </div>

    <div class="form-group">

        <label>IP Address</label>

        <input
            type="text"
            name="ip_address"
            value="{{ server.ip_address }}"
            required>

    </div>

    <div class="form-group">

        <label>Owner</label>

        <input
            type="text"
            name="owner"
            value="{{ server.owner }}"
            required>

    </div>

    <div class="form-group">

        <label>Status</label>

        <select name="status">

            <option value="Running"
                {% if server.status == "Running" %}selected{% endif %}>
                Running
            </option>

            <option value="Stopped"
                {% if server.status == "Stopped" %}selected{% endif %}>
                Stopped
            </option>

        </select>

    </div>

    <button type="submit" class="btn-primary">

        Update Server

    </button>

</form>

</div>

{% endblock %}
